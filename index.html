<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Apocalypse Story</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap');
        
        body { margin: 0; padding: 0; background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Nanum Myeongjo', serif; color: #eee; }
        #game-container { width: 800px; height: 600px; position: relative; background-color: #333; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.9); border: 1px solid #333; }
        
        /* 레이어 1: 배경 */
        #background { width: 100%; height: 100%; position: absolute; object-fit: cover; z-index: 1; transition: filter 2s ease-in-out, opacity 2s ease-in-out; display: none; }
        
        /* 눈 깜빡임 및 블러 효과용 오버레이 */
        #screen-effect { width: 100%; height: 100%; position: absolute; z-index: 2; background-color: black; pointer-events: none; opacity: 1; transition: opacity 1.5s ease-in-out; }
        .blink { animation: eyeBlink 3s ease-in-out forwards; }
        @keyframes eyeBlink {
            0% { background-color: rgba(0,0,0,1); }
            20% { background-color: rgba(0,0,0,0.2); }
            40% { background-color: rgba(0,0,0,0.9); }
            60% { background-color: rgba(0,0,0,0.1); }
            80% { background-color: rgba(0,0,0,0.5); }
            100% { background-color: rgba(0,0,0,0); }
        }
        .blur-effect { filter: blur(10px); }
        .clear-effect { filter: blur(0px); }

        /* 레이어 2: 캐릭터 */
        #character { height: 85%; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 3; opacity: 0; transition: opacity 1s ease-in-out; }

        /* 레이어 3: UI (대화창, 선택지 등) */
        #ui-layer { position: absolute; bottom: 0; width: 100%; height: 100%; z-index: 4; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
        
        #dialogue-box { background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.95)); border-top: 1px solid #555; padding: 25px 40px; height: 160px; box-sizing: border-box; position: relative; pointer-events: auto; cursor: pointer; display: none; }
        #speaker-name { font-weight: bold; font-size: 1.3em; color: #a9b0c0; margin-bottom: 15px; text-shadow: 1px 1px 2px #000; letter-spacing: 2px; }
        #dialogue-text { font-size: 1.15em; line-height: 1.6; color: #ddd; text-shadow: 1px 1px 2px #000; }
        
        /* 역삼각형 깜빡임 아이콘 */
        #next-indicator { position: absolute; bottom: 20px; right: 30px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 12px solid #aaa; animation: bounce 1s infinite; display: none; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(5px); opacity: 0.5; } }

        /* 선택지 및 이름 입력 영역 */
        #interactive-container { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 5; display: flex; flex-direction: column; gap: 15px; width: 70%; pointer-events: auto; }
        .choice-btn { background: rgba(20, 20, 20, 0.85); border: 1px solid #555; color: #ccc; padding: 15px; font-size: 1.1em; cursor: pointer; transition: all 0.3s; font-family: 'Nanum Myeongjo', serif; }
        .choice-btn:hover { background: rgba(80, 80, 80, 0.9); color: #fff; border-color: #888; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        
        #name-input-group { display: none; flex-direction: column; align-items: center; gap: 10px; background: rgba(0,0,0,0.8); padding: 30px; border: 1px solid #444; }
        #name-input { background: #111; border: 1px solid #666; color: #fff; padding: 10px; font-size: 1.2em; text-align: center; font-family: inherit; width: 200px; outline: none; }
        #name-submit { background: #333; color: #fff; border: 1px solid #666; padding: 8px 20px; font-size: 1.1em; cursor: pointer; font-family: inherit; transition: 0.3s; }
        #name-submit:hover { background: #555; }

        /* BGM 컨트롤 */
        #audio-controls { position: absolute; top: 10px; right: 10px; z-index: 10; opacity: 0.3; transition: 0.3s; }
        #audio-controls:hover { opacity: 1; }
    </style>
</head>
<body>
<div id="game-container">
    <div id="screen-effect"></div>
    <img id="background" src="" alt="배경">
    <img id="character" src="" alt="캐릭터">
    
    <div id="interactive-container">
        <div id="choices-area"></div>
        <div id="name-input-group">
            <label for="name-input">당신의 이름은?</label>
            <input type="text" id="name-input" placeholder="소로">
            <button id="name-submit">결정</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="dialogue-box" onclick="advanceStory()">
            <div id="speaker-name"></div>
            <div id="dialogue-text"></div>
            <div id="next-indicator"></div>
        </div>
    </div>
    
    <div id="audio-controls">
        <audio id="bgm" src="bgm.mp3" loop></audio>
    </div>
</div>

<script>
    let playerName = "소로";
    let currentNodeId = "intro_1";
    let isWaitingForInput = false;

    // 스토리 데이터
    const storyData = {
        "intro_1": {
            speaker: "", text: "온몸이 아프다...",
            bgImg: "black", charImg: "", effect: "black",
            nextNode: "intro_2"
        },
        "intro_2": {
            speaker: "", text: "기억이 나지 않는다...",
            bgImg: "black", charImg: "", effect: "black",
            nextNode: "intro_3"
        },
        "intro_3": {
            speaker: "", text: "(눈을 깜빡거리며 주변을 둘러본다)",
            bgImg: "gray", 
            charImg: "", effect: "blink_and_blur",
            nextNode: "name_input"
        },
        "name_input": {
            speaker: "시스템", text: "당신의 이름은 무엇입니까?",
            bgImg: "keep", charImg: "",
            type: "input", nextNode: "prologue"
        },
        "prologue": {
            speaker: "시스템", text: () => `${playerName}(은)는 부서진 방독면을 얼굴에 쓰고 넝마를 두른 채 살아가는 짐승이다.`,
            bgImg: "keep", 
            charImg: "1.png", // 준비해주신 투명화(누끼)된 1.png 이미지 바로 불러오기
            type: "normal", nextNode: "route_select"
        },
        "route_select": {
            speaker: "내면의 목소리", text: "앞으로 어떻게 살아갈 것인가?",
            bgImg: "keep", charImg: "keep",
            choices: [
                { text: "과오를 참회한다.", nextNode: "route_repent" },
                { text: "세상을 향해 오만해진다.", nextNode: "route_arrogance" }
            ]
        },
        "route_repent": { speaker: "시스템", text: "참회 루트로 진입합니다. (추후 스토리 추가)", bgImg: "keep", charImg: "keep" },
        "route_arrogance": { speaker: "시스템", text: "오만 루트로 진입합니다. (추후 스토리 추가)", bgImg: "keep", charImg: "keep" }
    };

    const bgElement = document.getElementById("background");
    const charElement = document.getElementById("character");
    const nameElement = document.getElementById("speaker-name");
    const textElement = document.getElementById("dialogue-text");
    const dialogueBox = document.getElementById("dialogue-box");
    const nextIndicator = document.getElementById("next-indicator");
    const screenEffect = document.getElementById("screen-effect");
    const choicesArea = document.getElementById("choices-area");
    const nameInputGroup = document.getElementById("name-input-group");
    const bgm = document.getElementById("bgm");
    const gameContainer = document.getElementById("game-container");

    function renderNode(nodeId) {
        const node = storyData[nodeId];
        if (!node) return;
        currentNodeId = nodeId;

        if (bgm.paused) { bgm.play().catch(e => console.log("BGM 재생 대기중")); }

        textElement.innerHTML = "";
        const fullText = typeof node.text === "function" ? node.text() : node.text;
        
        if (node.speaker === "") {
            nameElement.style.display = "none";
        } else {
            nameElement.style.display = "block";
            nameElement.textContent = node.speaker;
        }

        dialogueBox.style.display = "block";
        typeWriterEffect(fullText);

        if (node.effect === "black") {
            screenEffect.style.backgroundColor = "black";
            screenEffect.style.opacity = "1";
            screenEffect.className = "";
            bgElement.style.display = "none";
            gameContainer.style.backgroundColor = "black";
        } else if (node.effect === "blink_and_blur") {
            screenEffect.className = "blink";
            setTimeout(() => {
                bgElement.className = "clear-effect";
            }, 3000);
        }

        if (node.bgImg === "gray") {
            bgElement.style.display = "none";
            gameContainer.style.backgroundColor = "#444444";
        } else if (node.bgImg !== "keep" && node.bgImg !== "black") {
            bgElement.src = node.bgImg;
            bgElement.style.display = "block";
            bgElement.style.opacity = "1";
        }

        // ⚠️ 크로마키(자동누끼) 기능을 완전히 제거하고 이미지를 다이렉트로 안전하게 불러옵니다!
        if (node.charImg !== "keep") {
            if (node.charImg) {
                charElement.src = node.charImg;
                charElement.style.opacity = "1";
            } else {
                charElement.style.opacity = "0";
            }
        }

        choicesArea.innerHTML = "";
        nameInputGroup.style.display = "none";
        nextIndicator.style.display = "block";
        isWaitingForInput = false;

        if (node.type === "input") {
            isWaitingForInput = true;
            nextIndicator.style.display = "none";
            nameInputGroup.style.display = "flex";
        } else if (node.choices) {
            isWaitingForInput = true;
            nextIndicator.style.display = "none";
            node.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice-btn"; btn.textContent = choice.text;
                btn.onclick = () => renderNode(choice.nextNode);
                choicesArea.appendChild(btn);
            });
        }
    }

    let typingInterval;
    function typeWriterEffect(text) {
        let i = 0;
        textElement.innerHTML = "";
        clearInterval(typingInterval);
        typingInterval = setInterval(() => {
            if (i < text.length) {
                textElement.innerHTML += text.charAt(i);
                i++;
            } else {
                clearInterval(typingInterval);
            }
        }, 30);
    }

    function advanceStory() {
        if (isWaitingForInput) return;
        const node = storyData[currentNodeId];
        if (node && node.nextNode) {
            renderNode(node.nextNode);
        }
    }

    document.getElementById("name-submit").onclick = () => {
        const inputVal = document.getElementById("name-input").value.trim();
        if (inputVal !== "") playerName = inputVal;
        renderNode(storyData[currentNodeId].nextNode);
    };

    window.onload = () => {
        renderNode("start");
        renderNode(currentNodeId);
    };
</script>
</body>
</html>
