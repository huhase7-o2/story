<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Apocalypse Story: Soroh</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap');
        
        body { margin: 0; padding: 0; background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Nanum Myeongjo', serif; color: #eee; user-select: none; }
        
        #game-container { 
            width: 800px; height: 600px; position: relative; 
            background: radial-gradient(circle at 50% 30%, #3a3f44 0%, #1a1c1e 40%, #050505 100%);
            overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.9); border: 1px solid #222; 
        }
        
        .dust { position: absolute; width: 2px; height: 2px; background: rgba(255,255,255,0.2); border-radius: 50%; box-shadow: 0 0 5px rgba(255,255,255,0.5); animation: float 10s infinite linear; pointer-events: none; }
        @keyframes float {
            0% { transform: translateY(600px) translateX(0px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10px) translateX(50px); opacity: 0; }
        }

        #screen-effect { width: 100%; height: 100%; position: absolute; z-index: 2; background-color: black; pointer-events: none; transition: opacity 1.5s ease-in-out; }
        .blink { animation: eyeBlink 3s ease-in-out forwards; }
        @keyframes eyeBlink { 0% { opacity: 1; } 20% { opacity: 0.2; } 40% { opacity: 0.9; } 60% { opacity: 0.1; } 80% { opacity: 0.5; } 100% { opacity: 0; } }

        #character { height: 85%; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 3; opacity: 0; transition: opacity 1s ease-in-out; filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.8)); }

        #ui-layer { position: absolute; bottom: 0; width: 100%; height: 100%; z-index: 4; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
        
        #dialogue-box { 
            background: linear-gradient(to bottom, rgba(15, 15, 15, 0.8), rgba(0, 0, 0, 0.95)); 
            border-top: 1px solid #444; padding: 30px 40px; height: 170px; box-sizing: border-box; 
            position: relative; pointer-events: auto; cursor: pointer; display: none; backdrop-filter: blur(5px);
        }
        
        #speaker-name { font-weight: bold; font-size: 1.3em; color: #8e9eab; margin-bottom: 12px; letter-spacing: 2px; text-shadow: 1px 1px 2px #000; border-bottom: 1px solid #333; padding-bottom: 5px; display: inline-block; }
        #dialogue-text { font-size: 1.15em; line-height: 1.6; color: #d5d5d5; text-shadow: 1px 1px 2px #000; word-break: keep-all; }
        
        #next-indicator { position: absolute; bottom: 20px; right: 30px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 12px solid #8e9eab; animation: bounce 1.2s infinite; display: none; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(5px); opacity: 0.3; } }

        #interactive-container { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 5; display: flex; flex-direction: column; gap: 15px; width: 70%; pointer-events: auto; }
        .choice-btn { background: rgba(20, 20, 20, 0.85); border: 1px solid #555; color: #ccc; padding: 15px; font-size: 1.1em; cursor: pointer; transition: all 0.3s; font-family: 'Nanum Myeongjo', serif; letter-spacing: 1px; }
        .choice-btn:hover { background: rgba(80, 80, 80, 0.9); color: #fff; border-color: #888; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        
        #name-input-group { display: none; flex-direction: column; align-items: center; gap: 15px; background: rgba(10,10,10,0.9); padding: 30px; border: 1px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #name-input { background: #111; border: 1px solid #666; color: #fff; padding: 12px; font-size: 1.2em; text-align: center; font-family: inherit; width: 220px; outline: none; transition: border 0.3s; }
        #name-input:focus { border-color: #aaa; }
        #name-submit { background: #333; color: #fff; border: 1px solid #666; padding: 10px 25px; font-size: 1.1em; cursor: pointer; font-family: inherit; transition: 0.3s; }
        #name-submit:hover { background: #555; }
    </style>
</head>
<body>
<div id="game-container">
    <div id="dust-container"></div>
    <div id="screen-effect"></div>
    
    <img id="character" src="https://via.placeholder.com/300x400/000000/FFFFFF?text=Soroh" alt="캐릭터">
    
    <div id="interactive-container">
        <div id="choices-area"></div>
        <div id="name-input-group">
            <label for="name-input" style="color: #aaa; font-size: 1.1em; letter-spacing: 1px;">당신의 이름은 무엇입니까?</label>
            <input type="text" id="name-input" placeholder="소로">
            <button id="name-submit">기억해낸다</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="dialogue-box" onclick="advanceStory()">
            <div id="speaker-name"></div>
            <div id="dialogue-text"></div>
            <div id="next-indicator"></div>
        </div>
    </div>
</div>

<script>
    let playerName = "소로";
    let currentNodeId = "intro_1";
    let isWaitingForInput = false;

    const dustContainer = document.getElementById('dust-container');
    for(let i=0; i<30; i++) {
        let dust = document.createElement('div');
        dust.className = 'dust';
        dust.style.left = Math.random() * 800 + 'px';
        dust.style.animationDuration = (Math.random() * 5 + 5) + 's';
        dust.style.animationDelay = (Math.random() * 5) + 's';
        dustContainer.appendChild(dust);
    }

    let audioCtx;
    function playAmbientSound() {
        if(audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(55, audioCtx.currentTime); 
        
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 2);
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();

        setInterval(() => {
            const pingOsc = audioCtx.createOscillator();
            const pingGain = audioCtx.createGain();
            pingOsc.type = 'triangle';
            pingOsc.frequency.setValueAtTime(440 * (Math.random() > 0.5 ? 1 : 1.5), audioCtx.currentTime);
            
            pingGain.gain.setValueAtTime(0, audioCtx.currentTime);
            pingGain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.1);
            pingGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3);
            
            pingOsc.connect(pingGain);
            pingGain.connect(audioCtx.destination);
            pingOsc.start();
            pingOsc.stop(audioCtx.currentTime + 3);
        }, 5000);
    }

    const storyData = {
        "intro_1": { speaker: "", text: "온몸이 아프다...", effect: "black", nextNode: "intro_2" },
        "intro_2": { speaker: "", text: "기억이 나지 않는다...", effect: "black", nextNode: "intro_3" },
        "intro_3": { speaker: "", text: "(눈을 깜빡거리며 주변을 둘러본다)", effect: "blink", nextNode: "name_input" },
        "name_input": { speaker: "시스템", text: "당신의 이름은?", type: "input", nextNode: "prologue" },
        "prologue": { 
            speaker: "시스템", 
            text: () => `${playerName}(은)는 부서진 방독면을 얼굴에 쓰고 넝마를 두른 채 살아가는 짐승이다.`,
            showChar: true, type: "normal", nextNode: "route_select" 
        },
        "route_select": {
            speaker: "내면의 목소리", text: "앞으로 어떻게 살아갈 것인가?", showChar: true,
            choices: [
                { text: "과오를 참회한다.", nextNode: "route_repent" },
                { text: "세상을 향해 오만해진다.", nextNode: "route_arrogance" }
            ]
        },
        "route_repent": { speaker: "시스템", text: "참회 루트로 진입합니다.", showChar: true },
        "route_arrogance": { speaker: "시스템", text: "오만 루트로 진입합니다.", showChar: true }
    };

    const charElement = document.getElementById("character");
    const nameElement = document.getElementById("speaker-name");
    const textElement = document.getElementById("dialogue-text");
    const dialogueBox = document.getElementById("dialogue-box");
    const nextIndicator = document.getElementById("next-indicator");
    const screenEffect = document.getElementById("screen-effect");
    const choicesArea = document.getElementById("choices-area");
    const nameInputGroup = document.getElementById("name-input-group");

    function renderNode(nodeId) {
        const node = storyData[nodeId];
        if (!node) return;
        currentNodeId = nodeId;

        try { playAmbientSound(); } catch(e) {}

        textElement.innerHTML = "";
        const fullText = typeof node.text === "function" ? node.text() : node.text;
        
        if (node.speaker === "") {
            nameElement.style.display = "none";
        } else {
            nameElement.style.display = "inline-block";
            nameElement.textContent = node.speaker;
        }

        dialogueBox.style.display = "block";
        typeWriterEffect(fullText);

        if (node.effect === "black") {
            screenEffect.style.opacity = "1";
            screenEffect.className = "";
        } else if (node.effect === "blink") {
            screenEffect.className = "blink";
            setTimeout(() => { screenEffect.style.opacity = "0"; }, 3000);
        }

        if (node.showChar) {
            charElement.style.opacity = "1";
        } else {
            charElement.style.opacity = "0";
        }

        choicesArea.innerHTML = "";
        nameInputGroup.style.display = "none";
        nextIndicator.style.display = "block";
        isWaitingForInput = false;

        if (node.type === "input") {
            isWaitingForInput = true;
            nextIndicator.style.display = "none";
            nameInputGroup.style.display = "flex";
        } else if (node.choices) {
            isWaitingForInput = true;
            nextIndicator.style.display = "none";
            node.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice-btn"; btn.textContent = choice.text;
                btn.onclick = () => renderNode(choice.nextNode);
                choicesArea.appendChild(btn);
            });
        }
    }

    let typingInterval;
    function typeWriterEffect(text) {
        let i = 0;
        textElement.innerHTML = "";
        clearInterval(typingInterval);
        typingInterval = setInterval(() => {
            if (i < text.length) {
                textElement.innerHTML += text.charAt(i);
                i++;
            } else {
                clearInterval(typingInterval);
            }
        }, 30);
    }

    function advanceStory() {
        if (isWaitingForInput) return;
        const node = storyData[currentNodeId];
        if (node && node.nextNode) {
            renderNode(node.nextNode);
        }
    }

    document.getElementById("name-submit").onclick = () => {
        const inputVal = document.getElementById("name-input").value.trim();
        if (inputVal !== "") playerName = inputVal;
        renderNode(storyData[currentNodeId].nextNode);
    };

    window.onload = () => {
        renderNode("start");
        renderNode(currentNodeId);
    };
</script>
</body>
</html>
